server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: sentinel_audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: sentinel_ring0
          __path__: /logs/audit.jsonl
    pipeline_stages:
      # 1. Parse the JSON line into a map
      - json:
          expressions:
            cgroup_id: cgroup_id
            event_type: event_type
            severity: severity
      
      # 2. The Cardinality Filter: ONLY promote these specific, bounded fields to index labels
      - labels:
          cgroup_id:
          event_type:
          severity:
