name: Sentinel Supply Chain Attestation
on:
  release:
    types: [published]

jobs:
  provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for Sigstore keyless signing
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0
        
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sentinel-sbom.spdx.json
          
      - name: Build Sentinel Stack
        run: make -C sentinel-cc all
        
      - name: Sign Release Artifacts
        run: |
          cosign sign-blob --yes --output-signature sentinel.sig sentinel-cc/build/sentinel_daemon
          cosign sign-blob --yes --output-signature sentinel-sbom.sig sentinel-sbom.spdx.json
