name: Sentinel Stack CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  id-token: write # Required for Sigstore keyless signing
  security-events: write # Required for SAST upload

jobs:
  sast-scan:
    name: SAST Code Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Automated AST tree-sitter scanning (Semgrep)
      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
          generateSarif: "1"

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

  build-telos-lang:
    name: Build & Test telos-lang
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Test
        working-directory: telos-lang/telosc
        run: cargo test --verbose

      - name: Cargo Build Release
        working-directory: telos-lang/telosc
        run: cargo build --release
        
      - name: Generate Sigstore Provenance
        uses: sigstore/gh-action-sigstore-python@v2.1.1
        with:
          inputs: telos-lang/telosc/target/release/telosc

  build-telos-runtime:
    name: Build & Test telos-runtime
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: telos-runtime
        run: pip install -r cortex/requirements.txt pytest

      - name: Run Pytest
        working-directory: telos-runtime
        run: pytest cortex/

  build-hyperion-xdp:
    name: Build & Test hyperion-xdp
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Go Test
        working-directory: hyperion-xdp
        run: go test -v ./...

      - name: Go Build
        working-directory: hyperion-xdp
        run: go build -o bin/hyperion_ctrl ./cmd/hyperion

      - name: Generate Sigstore Provenance
        uses: sigstore/gh-action-sigstore-python@v2.1.1
        with:
          inputs: hyperion-xdp/bin/hyperion_ctrl
