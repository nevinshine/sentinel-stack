name: Sentinel Stack CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  id-token: write # Required for Sigstore keyless signing
  security-events: write # Required for SAST upload

jobs:
  sast-scan:
    name: SAST Code Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Automated AST tree-sitter scanning (Semgrep)
      - name: Install and Run Semgrep SAST
        run: |
          pip install semgrep
          semgrep scan --config="p/default" --sarif -o semgrep.sarif || true

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()

  build-telos-lang:
    name: Build & Test telos-lang
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Test
        working-directory: telos-lang/telosc
        run: cargo test --verbose

      - name: Cargo Build Release
        working-directory: telos-lang/telosc
        run: cargo build --release
        
      - name: Generate Sigstore Provenance
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: telos-lang/telosc/target/release/telosc

  build-telos-runtime:
    name: Build & Test telos-runtime
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: telos-runtime
        run: pip install -r cortex/requirements.txt pytest

      - name: Run Pytest
        working-directory: telos-runtime
        run: pytest cortex/

  build-hyperion-xdp:
    name: Build & Test hyperion-xdp
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Generate eBPF Bytecode
        working-directory: hyperion-xdp
        run: go generate ./...

      - name: Go Test
        working-directory: hyperion-xdp
        run: go test -v ./...

      - name: Go Build
        working-directory: hyperion-xdp
        run: go build -o bin/hyperion_ctrl ./cmd/hyperion

      - name: Generate Sigstore Provenance
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: hyperion-xdp/bin/hyperion_ctrl

  build-sentinel-cc:
    name: Build & Test sentinel-cc
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev libkeyutils-dev cmake make

      - name: Make Sentinel-CC
        working-directory: sentinel-cc
        run: make all

      - name: Test Sentinel-CC
        working-directory: sentinel-cc
        run: sudo make test

      - name: Setup Go for Integration Tests
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Test Cross-Layer Enforcement Parity
        run: sudo bash tests/integration/test_cross_layer_parity.sh
