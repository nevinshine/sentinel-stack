name: Docs Pipeline

on:
  push:
    branches: ["main"]
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  doxygen-extract:
    name: Extract C/C++ AST (Doxygen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Run Doxygen
        working-directory: docs-portal
        run: doxygen Doxyfile
      - name: Install Doxybook2
        run: |
          wget https://github.com/matusnovak/doxybook2/releases/download/v1.5.0/doxybook2-linux-amd64-v1.5.0.zip
          unzip doxybook2-linux-amd64-v1.5.0.zip
          sudo mv bin/doxybook2 /usr/local/bin/
          sudo chmod +x /usr/local/bin/doxybook2
      - name: Run Doxybook2
        working-directory: docs-portal
        run: |
          mkdir -p content/generated/c
          doxybook2 --input doxygen_output/xml --output content/generated/c --config config-doxybook2.json
      - uses: actions/upload-artifact@v4
        with:
          name: docs-c
          path: docs-portal/content/generated/c

  gomarkdoc-extract:
    name: Extract Go AST (Gomarkdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest
      - name: Run Gomarkdoc
        run: |
          mkdir -p docs-portal/content/generated/go
          cd hyperion-xdp
          $(go env GOPATH)/bin/gomarkdoc --output ../docs-portal/content/generated/go/hyperion-xdp.md ./...
      - uses: actions/upload-artifact@v4
        with:
          name: docs-go
          path: docs-portal/content/generated/go

  rustdoc-extract:
    name: Extract Rust AST (Rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y llvm-15-dev libclang-15-dev clang-15
      - name: Run Cargo Doc
        working-directory: telos-lang/telosc
        env:
          LLVM_SYS_150_PREFIX: /usr/lib/llvm-15
        run: |
          # Generate standard rustdoc HTML
          cargo doc --no-deps
      - name: Package Rustdoc
        run: |
          mkdir -p docs-portal/public/rustdoc
          cp -r telos-lang/telosc/target/doc/* docs-portal/public/rustdoc/
      - uses: actions/upload-artifact@v4
        with:
          name: docs-rust
          path: docs-portal/public/rustdoc

  python-extract:
    name: Extract Python AST (pdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pdoc
        run: pip install pdoc pydoc-markdown
      - name: Run pydoc-markdown
        run: |
          mkdir -p docs-portal/content/generated/python
          cd telos-runtime
          # Extract documentation using pydoc-markdown
          python -m pydoc_markdown -p telos_core -I . > ../docs-portal/content/generated/python/telos_core.md || true
          python -m pydoc_markdown -p cortex -I . > ../docs-portal/content/generated/python/cortex.md || true
      - uses: actions/upload-artifact@v4
        with:
          name: docs-python
          path: docs-portal/content/generated/python

  build-and-deploy:
    name: Build & Deploy Portal
    needs: [doxygen-extract, gomarkdoc-extract, rustdoc-extract, python-extract]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-portal/package-lock.json

      - name: Download all docs artifacts
        uses: actions/download-artifact@v4
        with:
          path: docs-artifacts

      - name: Assemble generated content
        working-directory: docs-portal
        run: |
          mkdir -p content/generated
          cp -r ../docs-artifacts/docs-c/* content/generated/ || true
          cp -r ../docs-artifacts/docs-go/* content/generated/ || true
          cp -r ../docs-artifacts/docs-python/* content/generated/ || true
          
          mkdir -p public/rustdoc
          cp -r ../docs-artifacts/docs-rust/* public/rustdoc/ || true

      - name: Install Next.js dependencies
        working-directory: docs-portal
        run: npm ci

      - name: Inject Metadata
        working-directory: docs-portal
        run: node scripts/inject-metadata.mjs content/generated

      - name: Build Next.js
        working-directory: docs-portal
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-portal/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
