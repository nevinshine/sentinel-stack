<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      .box { fill: #1e1e1e; stroke: #00b894; stroke-width: 2; rx: 5; }
      .text { fill: #ffffff; font-family: sans-serif; font-size: 14px; text-anchor: middle; }
      .line { stroke: #a0a0a0; stroke-width: 2; fill: none; }
      .arrow { fill: #a0a0a0; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>
  
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <rect x="50" y="70" width="150" height="60" class="box"/>
  <text x="125" y="105" class="text">Incoming Packet</text>
  
  <path d="M 200 100 L 290 100" class="line" marker-end="url(#arrowhead)"/>
  
  <rect x="300" y="70" width="200" height="60" class="box" stroke="#D22128"/>
  <text x="400" y="105" class="text">Hyperion XDP (NIC)</text>
  
  <path d="M 500 100 L 590 100" class="line" marker-end="url(#arrowhead)"/>
  
  <rect x="600" y="70" width="150" height="60" class="box"/>
  <text x="675" y="105" class="text">Kernel Network Stack</text>
</svg>
