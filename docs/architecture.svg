<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      .box { fill: #1e1e1e; stroke: #3776AB; stroke-width: 2; rx: 5; }
      .text { fill: #ffffff; font-family: sans-serif; font-size: 14px; text-anchor: middle; }
      .title { fill: #ffffff; font-family: sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .line { stroke: #a0a0a0; stroke-width: 2; fill: none; }
      .arrow { fill: #a0a0a0; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>
  
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <text x="400" y="30" class="title">Sentinel Stack Architecture</text>
  
  <!-- Layer 1 -->
  <rect x="50" y="70" width="700" height="60" class="box" stroke="#D22128"/>
  <text x="400" y="105" class="text" font-weight="bold">Ring 3 / User Space (Telos Compiler &amp; Policy Validation)</text>
  
  <!-- Layer 2 -->
  <rect x="50" y="150" width="700" height="60" class="box" stroke="#00b894"/>
  <text x="400" y="185" class="text" font-weight="bold">Ring 0 / Kernel Space (Telos Runtime eBPF LSM &amp; Hyperion XDP)</text>
  
  <!-- Layer 3 -->
  <rect x="50" y="230" width="700" height="60" class="box" stroke="#e1b12c"/>
  <text x="400" y="265" class="text" font-weight="bold">Ring -1 / Hypervisor (Sentinel VMI &amp; KVM)</text>
  
  <!-- Layer 4 -->
  <rect x="50" y="310" width="700" height="60" class="box" stroke="#8c7ae6"/>
  <text x="400" y="345" class="text" font-weight="bold">Ring -2 / Firmware &amp; Hardware (Sentinel SMM &amp; TCA PMP)</text>

  <!-- Arrows -->
  <path d="M 400 130 L 400 145" class="line" marker-end="url(#arrowhead)"/>
  <path d="M 400 210 L 400 225" class="line" marker-end="url(#arrowhead)"/>
  <path d="M 400 290 L 400 305" class="line" marker-end="url(#arrowhead)"/>
</svg>
